      { question: "Which tag emphasizes text (usually italic)?", options: ["<em>", "<strong>", "<b>", "<i>"], answer: 0, explanation: "✅ <em> emphasizes text." },

      { question: "Which tag contains metadata?", options: ["<body>", "<head>", "<footer>", "<main>"], answer: 1, explanation: "✅ <head> contains metadata." },
      { question: "Which tag is used for headings?", options: ["<heading>", "<h1>", "<head>", "<title>"], answer: 1, explanation: "✅ <h1> to <h6> are heading tags." },
      { question: "Which tag is used for background image?", options: ["<body background>", "<img>", "<bgimage>", "<background>"], answer: 0, explanation: "✅ <body background> sets a background image." },
      { question: "Which tag is used to underline text?", options: ["<u>", "<i>", "<b>", "<p>"], answer: 0, explanation: "✅ <u> underlines text." }

    let currentQuestion = 0;
    let score = 0;
    let timeLeft = quizData.length * 20;
    const timerDisplay = document.getElementById("timer");
    const scoreDisplay = document.getElementById("score");
    const totalDisplay = document.getElementById("total");
    const feedbackBox = document.getElementById("feedback");
    const rewardBox = document.getElementById("reward");

    function loadQuestion() {
      const q = quizData[currentQuestion];
      document.getElementById("question").innerText = `Q${currentQuestion + 1}: ${q.question}`;
      const optionsDiv = document.getElementById("options");
      feedbackBox.innerText = "";
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const q = quizData[currentQuestion];
      if (selected === q.answer) {
        score++;
        feedbackBox.innerHTML = `✅ Correct!<br>${q.explanation}`;
      } else {
        feedbackBox.innerHTML = `❌ Incorrect!<br>${q.explanation}`;
      }
      scoreDisplay.innerText = score;
      currentQuestion++;
      setTimeout(() => {
        if (currentQuestion < quizData.length) {
          loadQuestion();
        } else {
          endQuiz();
        }
      }, 2000);
    }
